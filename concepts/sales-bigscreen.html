<title>销售大屏 · 3D 城市</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@300;400;500&family=Noto+Sans+SC:wght@300;400;500&display=swap">
<style>
:root{ --bg:#05080f; --bg0:rgba(5,8,15,0); --ink:#e9eef5; --dim:#66748a; --rule:rgba(160,178,200,.16); --acc:#d3deea; --live:#e8cf8f; --wechat:#7fd9b3; --alipay:#8db8f0; --cash:#e8cf8f; }
body[data-style="deep"]{ --bg:#050b18; --bg0:rgba(5,11,24,0); --ink:#e3f1ff; --dim:#5f7f9e; --rule:rgba(120,190,255,.15); --acc:#a6dcff; }
body[data-style="mono"]{ --bg:#000; --bg0:rgba(0,0,0,0); --ink:#f1e9dc; --dim:#7a7368; --rule:rgba(241,233,220,.14); --acc:#f1e9dc; }
*{box-sizing:border-box} html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Roboto Mono","Noto Sans SC",monospace;overflow:hidden;font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;font-weight:400}
#gl{position:fixed;inset:0;cursor:grab} #gl.drag{cursor:grabbing}
#mask{position:fixed;inset:0;pointer-events:none;z-index:2;background:linear-gradient(90deg,var(--bg) 0%,var(--bg0) 26%,var(--bg0) 66%,var(--bg) 100%)}
#vig{position:fixed;inset:0;pointer-events:none;z-index:2;background:radial-gradient(ellipse 70% 60% at 50% 55%,transparent 55%,rgba(0,0,0,.5) 100%)}
#frame{position:fixed;inset:12px;pointer-events:none;z-index:3;border:1px solid var(--rule);clip-path:polygon(0 0,calc(100% - 22px) 0,100% 22px,100% 100%,22px 100%,0 calc(100% - 22px))}
.hud{position:fixed;z-index:5;color:var(--dim)} .cn{text-transform:none;letter-spacing:.05em;font-family:"Noto Sans SC","Roboto Mono",sans-serif}
.enter{opacity:0;translate:0 6px;animation:enter 1.1s cubic-bezier(.2,.7,.2,1) forwards} @keyframes enter{to{opacity:1;translate:0 0}}
#brand{top:32px;left:40px;display:flex;flex-direction:column;gap:7px} #brand .t{color:var(--ink);font-weight:500;letter-spacing:.4em;font-size:12px}
/* 顶部中央:只剩控件 */
#center{top:34px;left:50%;transform:translateX(-50%)}
/* 左侧:今日销量 / 收入(竖排)+ 曲线 */
#left{left:40px;top:112px;width:min(29vw,540px);display:flex;flex-direction:column;gap:26px;pointer-events:none}
#tot{display:flex;flex-direction:column;gap:20px}
#tot .k{font-size:10px;color:var(--dim)} #tot .v{color:var(--ink);font-size:38px;font-weight:300;letter-spacing:.02em;line-height:1.05;margin-top:8px;font-variant-numeric:tabular-nums}
#tot .v .u{font-size:10px;color:var(--dim);margin-left:8px;letter-spacing:.22em;font-weight:400}
#tot .v::after{content:"";display:block;width:22px;height:1px;background:transparent;margin:10px 0 0;transition:background .3s} #tot .v.on::after{background:var(--ink)}
#nav{display:flex;gap:26px;align-items:center}
#nav button{background:none;border:0;padding:0;font:inherit;letter-spacing:inherit;text-transform:inherit;color:var(--dim);cursor:pointer;display:inline-flex;align-items:center;gap:8px}
#nav button::before{content:"";width:5px;height:5px;border:1px solid var(--dim)} #nav button[aria-pressed="true"]{color:var(--ink)} #nav button[aria-pressed="true"]::before{background:var(--ink);border-color:var(--ink)}
#nav .sep{width:1px;height:12px;background:var(--rule)} #nav button:focus-visible,#list li:focus-visible,#back:focus-visible{outline:1px solid var(--ink);outline-offset:3px}
/* 右侧:只有门店列表 + 实时单子 */
#right{right:40px;top:32px;bottom:118px;width:292px;display:flex;flex-direction:column;gap:24px;text-align:right;align-items:flex-end}
#list{width:100%;min-height:0;flex:0 1 auto;display:flex;flex-direction:column} #list h2{margin:0 0 12px;font-size:10px;font-weight:400;color:var(--dim);flex:none}
#list ul{list-style:none;margin:0;padding:0 0 0 12px;display:flex;flex-direction:column;gap:6px;overflow:auto;min-height:0;direction:rtl}
#list ul::-webkit-scrollbar{width:3px} #list ul::-webkit-scrollbar-track{background:transparent} #list ul::-webkit-scrollbar-thumb{background:var(--rule)} #list ul:hover::-webkit-scrollbar-thumb{background:var(--dim)}
@supports not selector(::-webkit-scrollbar){#list ul{scrollbar-width:thin;scrollbar-color:var(--rule) transparent}}
#list li{direction:ltr;display:grid;grid-template-columns:auto 1fr 6px;gap:12px;align-items:center;cursor:pointer;color:var(--dim);transition:color .2s}
#list li .m{width:5px;height:5px;border:1px solid var(--dim)} #list li.on{color:var(--ink)} #list li.on .m{background:var(--ink);border-color:var(--ink)}
#list li:hover{color:var(--ink)} #list li .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:right} #list li .v{font-variant-numeric:tabular-nums;color:var(--ink);text-align:right;min-width:44px}
#list li.dim .v{color:var(--dim)} #list li.hit .m{background:var(--live);border-color:var(--live)}
#detail{width:100%;flex:none;display:none;flex-direction:column;gap:12px;padding-bottom:18px;border-bottom:1px solid var(--rule)} #detail.on{display:flex}
#detail .hd{display:flex;justify-content:flex-end;align-items:center;gap:14px} #detail .x{background:none;border:1px solid var(--rule);color:var(--dim);width:18px;height:18px;padding:0;font:inherit;font-size:13px;line-height:1;letter-spacing:0;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;flex:none;transition:color .2s,border-color .2s} #detail .x:hover,#detail .x:focus-visible{color:var(--ink);border-color:var(--ink);outline:0}
#detail .nm{color:var(--ink);font-size:14px;letter-spacing:.06em;text-transform:none;font-family:"Noto Sans SC","Roboto Mono",sans-serif;font-weight:500}
#detail .sub{font-size:10px} #detail .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 18px}
#detail .k{font-size:9.5px;color:var(--dim)} #detail .v{color:var(--ink);font-size:18px;font-weight:300;letter-spacing:.02em;margin-top:4px;font-variant-numeric:tabular-nums}
#detail .v small{font-size:9.5px;color:var(--dim);margin-left:5px;letter-spacing:.2em}
#detail .row{display:flex;justify-content:space-between;gap:12px;font-size:10px} #detail .row b{color:var(--ink);font-weight:400;font-variant-numeric:tabular-nums}
#detail .mix{display:flex;height:3px;width:100%;gap:2px;margin-top:6px} #detail .mix i{display:block;height:100%}
#detail .legend{display:flex;justify-content:space-between;font-size:9.5px;margin-top:6px} #detail .legend span::before{content:"";display:inline-block;width:5px;height:5px;margin-right:6px;vertical-align:middle}
#detail .stk{display:flex;gap:4px;justify-content:flex-end;margin-top:6px} #detail .stk i{display:block;width:10px;height:5px;background:var(--ink)} #detail .stk i.gone{background:rgba(102,116,138,.3)}
#detail .rc{display:grid;grid-template-columns:auto 1fr auto;gap:12px;font-size:10px;color:var(--dim)} #detail .rc b{color:var(--ink);font-weight:400;font-variant-numeric:tabular-nums}
#feed{width:100%;flex:none;display:flex;flex-direction:column;gap:7px;pointer-events:none;align-items:flex-end;min-height:84px}
#feed h2{margin:0 0 4px;font-size:10px;font-weight:400;color:var(--dim)}
.tick{display:flex;gap:12px;align-items:center;color:var(--dim);animation:in .35s ease-out;width:100%;white-space:nowrap} .tick .p{width:3px;height:11px;flex:none} .tick .cn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;text-align:right} .tick .a{color:var(--ink);font-variant-numeric:tabular-nums;flex:none}
@keyframes in{from{transform:translateY(6px);opacity:0}}
#chart{width:100%;height:230px} #chart canvas{width:100%;height:100%;display:block}
/* 左下:仪表 */
#scale{left:40px;bottom:40px} #scale .bar{width:120px;height:7px;border:1px solid var(--dim);border-top:0;margin-top:7px}
#compass{left:200px;bottom:40px;width:84px;height:84px;font-size:10px} #compass .ring{position:absolute;inset:11px;border:1px solid var(--rule);transform:rotate(45deg)}
#compass span{position:absolute} #compass .n{left:50%;top:0;transform:translateX(-50%);color:var(--ink)} #compass .s{left:50%;bottom:0;transform:translateX(-50%)}
#compass .w{left:0;top:50%;transform:translateY(-50%)} #compass .e{right:0;top:50%;transform:translateY(-50%)} #compass .deg{left:50%;top:50%;transform:translate(-50%,-50%);color:var(--ink)}
/* 底部中央:状态 + 返回 */
#status{right:40px;bottom:40px;display:flex;flex-direction:column;align-items:flex-end;gap:9px;text-align:right;white-space:nowrap}
#status i{display:inline-block;width:5px;height:5px;background:var(--live);margin-right:9px;animation:blink 2s infinite} @keyframes blink{50%{opacity:.25}} #status b{color:var(--ink);font-weight:400}
#back{position:fixed;bottom:40px;left:50%;transform:translateX(-50%);z-index:5;background:none;border:0;padding:0;font:inherit;letter-spacing:inherit;text-transform:inherit;color:var(--ink);cursor:pointer;display:none} #back.on{display:block}
@media (prefers-reduced-motion:reduce){.tick,#status i,.enter{animation:none;opacity:1;transform:none}}
</style>

 const feed=document.getElementById('feed');const t=document.createElement('div');t.className='tick';const col=hexCss(PAY[pay]);t.innerHTML=`<span class="p" style="background:${col}"></span><span class="cn">${s.n}</span><span>${({wechat:'微信',alipay:'支付宝',cash:'现金'})[pay]}</span><span class="a">+${q} · ¥${a}</span>`;feed.insertBefore(t,feed.children[1]||null);while(feed.children.length>5)feed.lastChild.remove();}
function tickOrders(t){if(t<nextAt)return;nextAt=t+(reduced?2500:900+rnd()*2100);const s=pickStore();const q=1+Math.floor(rnd()*3),a=Math.round((18+rnd()*90)*q),r=rnd();playOrder(s,q,a,r<.55?'wechat':r<.9?'alipay':'cash');}
// ── 主题 / 指标
function applyTheme(name){const T=THEMES[name];document.body.dataset.style=name;scene.background=new THREE.Color(T.bg);ground.material.color.setHex(T.ground);
 for(const m of themed.dist)m.material.color.setHex(m.userData.hot?T.hot:T.dist);for(const e of themed.dedge)e.material.color.setHex(T.dedge);roadMat.color.setHex(T.road);
 for(const w of themed.water)w.material.color.setHex(T.water);for(const e of themed.wedge)e.material.color.setHex(T.wedge);rippleMat.color.setHex(T.acc);
 for(const s of STORES){s.core.material.uniforms.uColor.value.setHex(T.acc);s.core.material.uniforms.uTint.value.setHex(s.pending?0x2a323c:T.tint);s.shell.material.color.setHex(T.glass);s.edges.material.color.setHex(T.acc);s.stem.material.color.setHex(T.acc);s.sel.material.color.setHex(T.acc);}
 relayout();}
document.querySelectorAll('[data-style]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('[data-style]').forEach(x=>x.setAttribute('aria-pressed',x===b));applyTheme(b.dataset.style);}));
document.querySelectorAll('[data-metric]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('[data-metric]').forEach(x=>x.setAttribute('aria-pressed',x===b));metric=b.dataset.metric;document.querySelectorAll('#tot .v').forEach(v=>v.classList.toggle('on',v.dataset.k===metric));relayout();if(focused)renderDetail(focused);}));
applyTheme('deep');
// ── 循环(含开场:方块依次升起、曲线画出、数字滚上)
const clock=new THREE.Clock();let lastChart=0;const ease=k=>1-Math.pow(1-k,3);
function frame(){requestAnimationFrame(frame);if(document.hidden)return;const dt=Math.min(clock.getDelta(),.05),t=performance.now(),el=clock.elapsedTime;
 tickOrders(t);chartReveal=reduced?1:Math.min(1,ease(Math.min(1,Math.max(0,(el-.6)/1.6))));
 const sc=Math.max(.38,Math.min(1,view.dist/DMAX));
 for(const s of stores3d){s.core.material.uniforms.uTime.value=el;const born=reduced?1:ease(Math.min(1,Math.max(0,(el-.4-s.born)/.9)));const bob=reduced?0:Math.sin(el*.7+s.phase)*.3;
  const cs=sc*born,hf=s.hf||1;s.cube.scale.set(cs,cs*hf,cs);const bottom=(HOVER-SQ/2+bob)*sc;s.cube.position.y=bottom+SQ*hf*cs/2;s.cube.rotation.y=s.phase+(reduced?0:el*.12*(1+s.spin));s.cube.rotation.x=reduced?0:Math.sin(el*.5+s.phase)*.05;s.cube.rotation.z=reduced?0:Math.cos(el*.4+s.phase)*.05;
  const st=s.stem.geometry.attributes.position;st.setY(1,(HOVER-SQ/2+bob)*sc);st.needsUpdate=true;s.stem.material.opacity=.22*born;
  s.shadow.scale.setScalar(sc*born);s.shadow.material.opacity=(.9-bob*.4)*born;const ls=Math.max(.5,sc);s.label.scale.setScalar(ls);s.label.position.x=(SQ/2+LABEL_W/2+1)*ls;s.label.material.opacity=born;}
 for(let i=boosts.length-1;i>=0;i--){const s=boosts[i];const u=s.core.material.uniforms.uBoost;u.value=Math.max(0,u.value-dt/1.8);s.shell.material.emissiveIntensity=Math.max(s.emBase||.03,s.shell.material.emissiveIntensity-dt*.07);if(u.value<=0)boosts.splice(i,1);}
 for(let i=ripples.length-1;i>=0;i--){const r=ripples[i];r.t+=dt/1.6;const k=Math.min(1,r.t);r.m.scale.setScalar(SQ*(.6+ease(k)*3.2)*sc);r.m.material.opacity=.45*(1-k);if(k>=1){scene.remove(r.m);r.m.material.dispose();ripples.splice(i,1);}}
 for(const k in shown)shown[k]+=(today[k]-shown[k])*Math.min(1,dt*(el<2.5?1.6:4));
 document.querySelectorAll('#tot .v').forEach(v=>{v.firstChild.textContent=fmt(v.dataset.k,shown[v.dataset.k]);});
 if(t-lastChart>120){lastChart=t;drawChart();const d=now();document.getElementById('asof').textContent=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}
 if(tween){tween.t+=dt/tween.dur;const k=Math.min(tween.t,1),e=k*k*(3-2*k);view.target.lerpVectors(tween.t0,tween.t1,e);view.dist=tween.d0+(tween.d1-tween.d0)*e;if(k>=1)tween=null;}
 placeCamera(dt);document.getElementById('zoom').textContent=(DMAX/view.dist).toFixed(2)+'x';const deg=((-view.az*180/Math.PI)%360+360)%360;document.getElementById('deg').textContent=String(Math.round(deg)).padStart(3,'0')+'°';
 renderer.render(scene,camera);}
frame();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);drawChart();});
