<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050b18">
<link rel="icon" href="../assets/favicon.ico" sizes="any">
<title>产品动线牌桌</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{--bg:#050b18;--ink:#e3f1ff;--dim:#5f7f9e;--dim2:#8fa9c4;--rule:rgba(120,190,255,.15);--acc:#a6dcff;--live:#e8cf8f;--bad:#c76b6b;--warn:#d9a441;--ok:#5fd3c4;--fs:1;
  --sans:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;--mono:"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;color-scheme:dark}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;overflow:hidden;text-transform:uppercase;letter-spacing:.12em}
.bs{position:relative;width:100%;height:100%;min-height:640px}
.bs-gl{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab}.bs-gl.drag{cursor:grabbing}
.bs-mask{position:absolute;inset:0;pointer-events:none;z-index:2;background:linear-gradient(90deg,var(--bg) 0%,transparent 22%,transparent 72%,var(--bg) 100%)}
.bs-vig{position:absolute;inset:0;pointer-events:none;z-index:2;background:radial-gradient(ellipse 70% 60% at 50% 55%,transparent 55%,rgba(0,0,0,.5) 100%)}
.bs-frame{position:absolute;inset:12px;pointer-events:none;z-index:3;border:1px solid var(--rule);clip-path:polygon(0 0,calc(100% - 22px) 0,100% 22px,100% 100%,22px 100%,0 calc(100% - 22px))}
.bs-hud{position:absolute;z-index:4;font-size:calc(10px * var(--fs));color:var(--dim)}
.bs-brand{top:32px;left:40px;display:flex;flex-direction:column;gap:7px}.bs-brand .t{color:var(--ink);font-weight:500;letter-spacing:.4em;font-size:calc(12px * var(--fs))}
.bs-brand .s{font-family:var(--mono);letter-spacing:.2em}
.bs-center{top:34px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px}
.bs-nav{display:flex;align-items:center;gap:0;border:1px solid var(--rule);background:color-mix(in srgb,var(--bg) 55%,transparent)}
.bs-nav button{appearance:none;background:none;border:0;color:var(--dim);font:inherit;letter-spacing:.18em;text-transform:uppercase;padding:9px 16px;cursor:pointer;min-height:36px;border-right:1px solid var(--rule)}
.bs-nav button:last-child{border-right:0}
.bs-nav button[aria-pressed="true"]{color:var(--live)}
.bs-nav button:focus-visible{outline:1px solid var(--ink);outline-offset:3px}
.bs-left{left:40px;top:calc(112px * var(--fs));width:min(26vw,420px);display:flex;flex-direction:column;gap:22px;pointer-events:none}
.bs-tot{display:flex;flex-direction:column;gap:18px}
.bs-tot .k{font-size:calc(10px * var(--fs));color:var(--dim)}
.bs-tot .v{color:var(--ink);font-size:calc(38px * var(--fs));font-weight:300;letter-spacing:.02em;line-height:1.05;margin-top:6px;font-variant-numeric:tabular-nums;font-family:var(--sans)}
.bs-tot .v .u{font-size:calc(10px * var(--fs));color:var(--dim);margin-left:8px;letter-spacing:.22em}
.bs-tot .v.bad{color:var(--bad)}.bs-tot .v.live{color:var(--live)}
.bs-tot{flex-direction:row;flex-wrap:wrap;gap:14px 26px}.bs-tot>div{min-width:96px}
.bs-chips{bottom:64px;left:50%;transform:translateX(-50%);display:none;gap:0;border:1px solid var(--rule);background:color-mix(in srgb,var(--bg) 55%,transparent);pointer-events:auto}.bs-chips.on{display:flex}.bs-chips button{appearance:none;background:none;border:0;border-right:1px solid var(--rule);color:var(--dim);font:inherit;letter-spacing:.18em;padding:7px 14px;cursor:pointer;min-height:32px}.bs-chips button:last-child{border-right:0}.bs-chips button[aria-pressed="true"]{color:var(--live)}
.bs-feed{border-top:1px solid var(--rule);padding-top:12px;display:flex;flex-direction:column;gap:7px;text-transform:none;letter-spacing:.04em}
.bs-feed .h{font-family:var(--mono);font-size:calc(10px * var(--fs));letter-spacing:.24em;text-transform:uppercase;color:var(--dim);margin-bottom:2px}
.bs-feed div.i{display:grid;grid-template-columns:44px 1fr;gap:8px;font-size:calc(11.5px * var(--fs));color:var(--dim2)}.bs-feed div.i b{font-weight:400;color:var(--ink)}.bs-feed div.i em{font-style:normal;font-family:var(--mono);color:var(--dim);font-size:calc(10px * var(--fs))}.bs-feed div.i.bad b{color:var(--bad)}.bs-feed div.i.live b{color:var(--live)}
.bs-right{right:40px;top:calc(112px * var(--fs));width:min(30vw,440px);display:flex;flex-direction:column;gap:14px;pointer-events:none}
.bs-panel{border:1px solid var(--rule);background:color-mix(in srgb,var(--bg) 62%,transparent);padding:14px 16px;text-transform:none;letter-spacing:.04em;backdrop-filter:blur(6px);transition:opacity .35s}
.bs-panel.off{opacity:0}
.bs-panel .h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:10px}
.bs-panel .h .nm{color:var(--ink);font-size:calc(15px * var(--fs));font-weight:500;letter-spacing:.06em}
.bs-panel .h .st{font-family:var(--mono);font-size:calc(10px * var(--fs));letter-spacing:.14em;text-transform:uppercase}
.bs-panel .st.bad{color:var(--bad)}.bs-panel .st.warn{color:var(--warn)}.bs-panel .st.ok{color:var(--ok)}.bs-panel .st.live{color:var(--live)}
.bs-panel .row{display:flex;justify-content:space-between;gap:12px;font-size:calc(12px * var(--fs));line-height:1.9;color:var(--dim2)}
.bs-panel .row em{font-style:normal;color:var(--ink);font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:calc(11.5px * var(--fs))}
.bs-panel ul{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.bs-panel li{display:grid;grid-template-columns:auto 1fr;gap:10px;font-size:calc(11.5px * var(--fs));color:var(--dim2);line-height:1.5}
.bs-panel li b{font-family:var(--mono);color:var(--ink);font-weight:500;white-space:nowrap}
.bs-panel li.rej b{color:var(--bad)}.bs-panel li.ok b{color:var(--ok)}.bs-panel li.late b{color:var(--bad)}
.bs-panel .k{font-size:calc(10px * var(--fs));color:var(--dim);letter-spacing:.14em;text-transform:uppercase;margin:12px 0 4px;font-family:var(--mono)}
.bs-stuck li{grid-template-columns:8px 1fr auto;align-items:center;padding:6px 0;border-top:1px solid var(--rule);pointer-events:auto;cursor:pointer}
.bs-stuck li:first-child{border-top:0}.bs-stuck li:hover .n{color:var(--live)}
.bs-stuck i{width:6px;height:6px;background:var(--bad);display:block}.bs-stuck i.warn{background:var(--warn)}
.bs-stuck .n{color:var(--ink);font-size:calc(12.5px * var(--fs))}.bs-stuck .w{font-size:calc(10.5px * var(--fs));color:var(--dim)}
.bs-stuck .d{font-family:var(--mono);color:var(--bad);font-variant-numeric:tabular-nums}.bs-stuck .d.warn{color:var(--warn)}
.bs-status{right:40px;bottom:40px;display:flex;flex-direction:column;align-items:flex-end;gap:9px;text-align:right;white-space:nowrap;letter-spacing:.2em;font-family:var(--mono)}
.bs-status .line{display:flex;align-items:center;gap:8px}.bs-status i{width:5px;height:5px;background:var(--live);display:inline-block;animation:blink 2.2s infinite}
.bs-status.paused i{background:var(--dim);animation:none}
.bs-status button{appearance:none;background:none;border:1px solid var(--rule);color:var(--dim);font:inherit;letter-spacing:.2em;text-transform:uppercase;padding:6px 12px;cursor:pointer;pointer-events:auto;min-height:32px}
.bs-status button:hover{color:var(--ink);border-color:var(--ink)}
.bs-status .bar{width:160px;height:1px;background:var(--rule);position:relative}.bs-status .bar i{position:absolute;left:0;top:0;height:1px;width:0;background:var(--live);animation:none}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
.bs-back{left:40px;bottom:40px;appearance:none;background:color-mix(in srgb,var(--bg) 60%,transparent);border:1px solid var(--rule);color:var(--dim);font:inherit;letter-spacing:.2em;text-transform:uppercase;padding:9px 16px;cursor:pointer;min-height:36px;opacity:0;pointer-events:none;transition:opacity .3s}
.bs-back.on{opacity:1;pointer-events:auto}.bs-back:hover{color:var(--ink);border-color:var(--ink)}
.bs-hint{left:50%;bottom:44px;transform:translateX(-50%);letter-spacing:.2em;font-family:var(--mono);white-space:nowrap;transition:opacity .3s}
.lbls{position:absolute;inset:0;pointer-events:none;z-index:3}
.lbls div{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;font-family:var(--mono);font-size:calc(10px * var(--fs));letter-spacing:.18em;color:var(--dim);text-align:center;text-shadow:0 0 10px var(--bg);transition:opacity .3s}
.lbls div b{display:block;font-family:var(--sans);text-transform:none;letter-spacing:.1em;color:var(--ink);font-weight:400;font-size:calc(12.5px * var(--fs))}
.lbls div.bad b{color:var(--bad)}.lbls div.live b{color:var(--live)}.lbls div.sm{font-size:calc(9px * var(--fs))}.lbls div.sm b{font-size:calc(10.5px * var(--fs))}
@media (max-width:900px){:root{--fs:.8}.bs-left,.bs-right{display:none}.bs-brand{left:24px}.bs-status{right:24px}.bs-back{left:24px}}
@media (prefers-reduced-motion:reduce){.bs-status i{animation:none}}
</style>
</head>
<body>
<div class="bs" id="bs">
  <canvas class="bs-gl" id="gl" aria-label="产品动线牌桌,三维视图"></canvas>
  <div class="bs-mask"></div><div class="bs-vig"></div><div class="bs-frame"></div>
  <div class="lbls" id="lbls"></div>
  <div class="bs-hud bs-brand"><span class="t">产品动线</span><span class="s">PIPELINE · DEV → RETAIL · 示例数据</span></div>
  <div class="bs-hud bs-center">
    <div class="bs-nav" role="group" aria-label="分堆方式">
      <button aria-pressed="true" data-g="status">按状态</button><button aria-pressed="false" data-g="stage">按步骤</button><button aria-pressed="false" data-g="owner">按负责人</button><button aria-pressed="false" data-g="updated">按更新</button><button aria-pressed="false" data-g="dense">明细</button>
    </div>
  </div>
  <div class="bs-hud bs-left">
    <div class="bs-tot" id="tot"></div>
    <div class="bs-feed" id="feed"></div>
  </div>
  <div class="bs-hud bs-right">
    <div class="bs-panel" id="focus"></div>
    
  </div>
  <button class="bs-hud bs-back" id="back">← 回到牌桌</button>
  <div class="bs-hud bs-chips" id="chips"></div>
  <div class="bs-hud bs-hint" id="hint">点一叠牌在空间里摊开 · 滚轮或拖动翻牌 · 点牌看它的时间维度</div>
  <div class="bs-hud bs-status" id="status"><div class="line"><i></i><span id="stline">轮播中 · 牌桌</span></div><div class="bar"><i id="bar"></i></div><button id="tour">暂停轮播</button></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.158.0/three.min.js"></script>
<script>
(function(){
'use strict';
// ───────── 示例数据 ─────────
const STAGES=[{k:'idea',n:'创意',d:5},{k:'sketch',n:'手绘线稿',d:7},{k:'design',n:'设计定稿',d:10},{k:'sample',n:'打样',d:14},{k:'verify',n:'验样',d:5},{k:'final',n:'定型',d:3},{k:'sku',n:'转 SKU',d:2},{k:'po',n:'采购首单',d:7}];
const DEPTS={toy:['玩具组','#7fa6e6'],gift:['文创组','#b28ce6'],food:['食品组','#e6a87f'],apparel:['服饰组','#8fd6a8']};
const WAIT={idea:'设计总监评审',sketch:'设计师',design:'老板批准',sample:'采购确认付款',verify:'设计师验样',final:'设计师',sku:'采购建单',po:'采购下首单'};
const TODAY=new Date('2026-09-30T12:00:00');const day=n=>new Date(TODAY.getTime()-n*864e5);const fmt=d=>`${d.getMonth()+1}/${d.getDate()}`;
const RAW=[['熊猫盲盒 3 代','toy',3,9,'王丹',1,'2026-10-20',[4,6,9]],['汉服书签','gift',1,2,'李孝龙',2,null,[3]],['花椒曲奇','food',7,12,'费岩岩',9,'2026-10-12',[5,6,8,12,4,2,1]],['山水帆布包','gift',4,2,'陈洁',0,null,[4,7,11,13]],['蜀绣耳饰','apparel',2,4,'王丹',3,null,[5,6]],['熊猫抱枕','toy',7,3,'李孝龙',1,'2026-10-30',[4,5,9,14,4,3,2]],['豆花冰箱贴','gift',0,1,'邓玉岩',1,null,[]],['麻辣牛肉干','food',5,1,'费岩岩',0,null,[6,7,10,15,5]],['蒲扇香囊','gift',3,16,'陈洁',11,'2026-10-08',[5,8,12]],['川剧变脸 T 恤','apparel',6,4,'王丹',5,'2026-10-15',[4,6,10,13,5,3]],['竹编灯','gift',2,11,'邓玉岩',8,null,[6,9]],['熊猫雨伞','toy',7,9,'李孝龙',7,null,[5,7,9,16,5,3,2]],['麻将糖','food',4,6,'邓玉岩',2,null,[4,6,11,14]],['羌绣围巾','apparel',1,9,'王丹',9,'2026-10-05',[5]],['盖碗茶杯','gift',5,2,'陈洁',1,null,[4,7,9,12,4]],['花生糖礼盒','food',6,1,'费岩岩',0,null,[5,6,9,13,5,3]],['锦里夜灯','gift',3,5,'邓玉岩',2,null,[4,6,9]],['熊猫棒球帽','apparel',2,3,'王丹',1,null,[3,5]]];
const P=RAW.map((r,i)=>{const p={id:i,name:r[0],dept:r[1],stage:r[2],days:r[3],owner:r[4],upd:r[5],plan:r[6],hist:r[7],steps:[]};let c=p.days;for(let k=p.stage;k>=0;k--){const len=k===p.stage?p.days:p.hist[k];p.steps[k]={enter:day(c),leave:k===p.stage?null:day(c-len),len};c+=(k>0?p.hist[k-1]:0)}
  p.rounds=p.stage>=1?[{n:1,t:day(p.days+2),r:'rej',by:'设计总监',why:'配色和参考图不符,主视觉再收一版'},{n:2,t:day(p.days),r:'ok',by:'设计总监',why:'通过'}]:[{n:1,t:day(1),r:'pending',by:'设计总监',why:'待评审'}];
  p.tasks=[{t:'补第 2 版效果图',who:p.owner,due:day(-2),done:p.stage>2},{t:'找供应商报价',who:'采购',due:day(p.days-4),done:p.stage>3},{t:'样品拍照存档',who:p.owner,due:day(-5),done:false}];return p});
function health(p){const st=STAGES[p.stage];if(p.plan){const left=(new Date(p.plan)-TODAY)/864e5;if(left<0)return 'bad';if(left<3)return 'warn'}if(p.days>st.d)return 'bad';if(p.days>=st.d*0.7)return 'warn';return 'ok'}
const HC={ok:0x5fd3c4,warn:0xd9a441,bad:0xc76b6b};const CSS={ok:'#5fd3c4',warn:'#d9a441',bad:'#c76b6b'};

// ───────── 牌面(Canvas 纹理) ─────────
const CW=2.4,CH=3.2,TW=384,TH=512;
function roundRect(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function face(p,snap){ // snap = {i,status:'done'|'cur'|'future'} → 时间快照;省略 = 当前牌面
  const cv=document.createElement('canvas');cv.width=TW;cv.height=TH;const c=cv.getContext('2d');const h=health(p);const st=snap?STAGES[snap.i]:STAGES[p.stage];
  const g=c.createLinearGradient(0,0,TW,TH);g.addColorStop(0,'rgba(16,35,61,.9)');g.addColorStop(.5,'rgba(10,26,48,.86)');g.addColorStop(1,'rgba(7,18,36,.9)');c.fillStyle=g;roundRect(c,0,0,TW,TH,26);c.fill();
  c.strokeStyle='rgba(166,220,255,.22)';c.lineWidth=2;roundRect(c,3,3,TW-6,TH-6,24);c.stroke();
  const edge=snap?(snap.status==='done'?'#5fd3c4':(snap.status==='cur'?CSS[h]:'rgba(95,127,158,.6)')):(h==='ok'?(p.stage>=7?'#e8cf8f':'rgba(166,220,255,.5)'):CSS[h]);
  c.strokeStyle=edge;c.lineWidth=5;roundRect(c,10,10,TW-20,TH-20,20);c.stroke();
  c.fillStyle=DEPTS[p.dept][1];c.fillRect(28,34,120,4);
  c.fillStyle='#e3f1ff';c.font='500 34px "Noto Sans SC","PingFang SC",sans-serif';c.fillText(p.name,28,90);
  c.fillStyle='#8fa9c4';c.font='400 20px "Noto Sans SC",sans-serif';c.fillText(DEPTS[p.dept][0],28,124);
  // 进度格
  const gw=(TW-56-7*6)/8;STAGES.forEach((s,i)=>{const cur=snap?i===snap.i:i===p.stage;const done=snap?i<snap.i:i<p.stage;c.fillStyle=done?'#5fd3c4':(cur?(snap?(snap.status==='done'?'#5fd3c4':edge):CSS[h]==='#5fd3c4'?'#e8cf8f':CSS[h]):'rgba(143,169,196,.18)');c.fillRect(28+i*(gw+6),150,gw,7)});
  c.fillStyle='#e3f1ff';c.font='400 40px "Noto Sans SC",sans-serif';c.fillText(st.n,28,226);
  c.font='500 22px "SF Mono",Menlo,monospace';c.fillStyle='#8fa9c4';
  if(snap){const s=p.steps[snap.i];if(s){c.fillText(`${fmt(s.enter)} ${s.leave?'→ '+fmt(s.leave):'→ 今天'}`,28,270);c.fillStyle=s.len>st.d?'#d9a441':'#5fd3c4';c.font='600 56px "SF Mono",Menlo,monospace';c.fillText(`${s.len}`,28,350);c.fillStyle='#8fa9c4';c.font='400 20px "Noto Sans SC",sans-serif';c.fillText(`天 · 常规 ${st.d} 天`,120,350)}else{c.fillText('还没到这一步',28,270);c.fillStyle='rgba(143,169,196,.7)';c.font='400 20px "Noto Sans SC",sans-serif';c.fillText(`常规 ${st.d} 天 · ${WAIT[st.k]}`,28,310)}}
  else{c.fillText(`停了 ${p.days} 天 · 常规 ${st.d} 天`,28,262);c.fillStyle=h==='ok'?'#8fa9c4':CSS[h];c.font='400 23px "Noto Sans SC",sans-serif';c.fillText(h==='bad'?`等 ${WAIT[st.k]}`:(h==='warn'?'快到期':`更新 ${p.upd===0?'今天':p.upd+' 天前'}`),28,300)}
  if(!snap){ // 最近一次动作 / 任务进度 / 计划日期——牌面是看得最多的地方,信息密度要最高
    const last=p.rounds[p.rounds.length-1];c.fillStyle='#5f7f9e';c.font='400 17px "SF Mono",Menlo,monospace';c.fillText('LAST',28,348);
    c.fillStyle='#c9d8e8';c.font='400 19px "Noto Sans SC",sans-serif';const lt=`${fmt(last.t)} ${last.by}${last.r==='rej'?'退回:':(last.r==='ok'?'通过':'待评审')}${last.r==='rej'?last.why.slice(0,9)+'…':''}`;c.fillText(lt,88,348);
    const done=p.tasks.filter(t=>t.done).length,late=p.tasks.filter(t=>!t.done&&t.due<TODAY).length;c.fillStyle='#5f7f9e';c.font='400 17px "SF Mono",Menlo,monospace';c.fillText('TASKS',28,384);
    c.fillStyle='rgba(143,169,196,.2)';c.fillRect(100,375,180,8);c.fillStyle=late?'#c76b6b':'#5fd3c4';c.fillRect(100,375,180*done/p.tasks.length,8);c.fillStyle='#c9d8e8';c.font='400 18px "Noto Sans SC",sans-serif';c.fillText(`${done}/${p.tasks.length}${late?' · 逾期 '+late:''}`,292,384);
    c.fillStyle='#5f7f9e';c.font='400 17px "SF Mono",Menlo,monospace';c.fillText('PLAN',28,416);c.fillStyle=p.plan?(new Date(p.plan)<TODAY?'#c76b6b':'#c9d8e8'):'#5f7f9e';c.font='400 19px "Noto Sans SC",sans-serif';
    c.fillText(p.plan?`${p.plan.slice(5).replace('-','/')} · ${new Date(p.plan)<TODAY?'超 '+Math.round((TODAY-new Date(p.plan))/864e5)+' 天':'还有 '+Math.round((new Date(p.plan)-TODAY)/864e5)+' 天'}`:'没填计划日期',88,416)}
  // 负责人

function renderTot(){const stuck=P.filter(p=>health(p)==='bad'),warn=P.filter(p=>health(p)==='warn'),handed=P.filter(p=>p.stage>=7);
  document.getElementById('tot').innerHTML=`<div><div class="k">推进中的产品</div><div class="v">${P.length}<span class="u">PROJECTS</span></div></div><div><div class="k">卡住了</div><div class="v bad">${stuck.length}<span class="u">STUCK</span></div></div><div><div class="k">快到期</div><div class="v" style="color:var(--warn)">${warn.length}<span class="u">SOON</span></div></div><div><div class="k">已交采购</div><div class="v live">${handed.length}<span class="u">HANDED</span></div></div><div><div class="k">本周到期</div><div class="v">${P.filter(p=>p.plan&&(new Date(p.plan)-TODAY)/864e5<=7&&new Date(p.plan)>=TODAY).length}<span class="u">THIS WEEK</span></div></div><div><div class="k">平均周期</div><div class="v">${Math.round(P.reduce((a,p)=>a+p.hist.reduce((x,y)=>x+y,0)+p.days,0)/P.length)}<span class="u">天 / 件</span></div></div>`;
  // 今日动态:从数据里推——今天更新过的、刚被退回的、刚交采购的
  const feed=[];P.filter(p=>p.upd===0).forEach(p=>feed.push({t:'今天',c:'',h:p.name,s:`${STAGES[p.stage].n}有更新 · ${p.owner}`}));
  P.filter(p=>p.rounds.some(r=>r.r==='rej'&&(TODAY-r.t)/864e5<=2)).forEach(p=>feed.push({t:'昨天',c:'bad',h:p.name,s:'设计总监退回:'+p.rounds.find(r=>r.r==='rej').why.slice(0,12)}));
  P.filter(p=>p.stage>=7&&p.days<=3).forEach(p=>feed.push({t:fmt(day(p.days)),c:'live',h:p.name,s:'转 SKU,交给采购下首单'}));
  document.getElementById('feed').innerHTML='<div class="h">今日动态</div>'+feed.slice(0,6).map(f=>`<div class="i ${f.c}"><em>${f.t}</em><span><b>${f.h}</b> · ${f.s}</span></div>`).join('')}
function renderFocus(p,i){const el=document.getElementById('focus');if(!p){el.classList.add('off');return}el.classList.remove('off');const s=STAGES[i],st=p.steps[i],h=health(p),cur=i===p.stage,done=i<p.stage;
  const pill=done?'<span class="st ok">已完成</span>':(cur?`<span class="st ${h}">${h==='bad'?'卡住 · 等 '+WAIT[s.k]:(h==='warn'?'快到期':'进行中')}</span>`:'<span class="st">还没到</span>');
  let html=`<div class="h"><span class="nm">${p.name} · ${s.n}</span>${pill}</div><div class="row"><span>负责人</span><em>${p.owner}</em></div><div class="row"><span>${st?'进入':'常规用时'}</span><em>${st?fmt(st.enter):s.d+' 天'}</em></div>${st?`<div class="row"><span>${st.leave?'离开':'已停'}</span><em>${st.leave?fmt(st.leave):st.len+' 天 / 常规 '+s.d+' 天'}</em></div>`:''}<div class="row"><span>评审人</span><em>${WAIT[s.k]}${i===2?' + 老板':''}</em></div>${cur&&p.plan?`<div class="row"><span>计划完成</span><em>${p.plan.slice(5)}</em></div>`:''}`;
  if(cur||done){html+=`<div class="k">评审记录</div><ul>${(cur?p.rounds:[{n:1,t:st.enter,r:'ok',by:'设计总监',why:'通过'}]).map(r=>`<li class="${r.r}"><b>第 ${r.n} 轮 · ${fmt(r.t)}</b><span>${r.by}:${r.r==='rej'?'退回修改 — ':''}${r.why}</span></li>`).join('')}</ul><div class="k">这一步的任务</div><ul>${p.tasks.map(t=>{const late=!t.done&&t.due<TODAY;return `<li class="${late?'late':''}"><b>${t.done?'已完成':(late?'逾期 '+Math.round((TODAY-t.due)/864e5)+'d':fmt(t.due))}</b><span style="${t.done?'text-decoration:line-through;opacity:.6':''}">${t.t} · ${t.who}</span></li>`}).join('')}</ul>`}
  el.innerHTML=html}

// ───────── 交互 ─────────
const ray=new THREE.Raycaster(),mouse=new THREE.Vector2(-9,-9);let dragging=false,dragX=0,dragAcc=0,lastUser=0,downOnCanvas=false;
function user(){lastUser=performance.now();if(tourOn)tourPause(true)}
canvas.addEventListener('pointermove',e=>{const r=canvas.getBoundingClientRect();mouse.x=((e.clientX-r.left)/r.width)*2-1;mouse.y=-((e.clientY-r.top)/r.height)*2+1;if(dragging){dragAcc+=e.clientX-dragX;dragX=e.clientX;if(Math.abs(dragAcc)>40){fanOff=Math.max(0,Math.min(groups().find(g=>g.key===openKey).cards.length-1,fanOff-Math.sign(dragAcc)));dragAcc=0;layoutFan(openKey)}}});
canvas.addEventListener('pointerdown',e=>{user();downOnCanvas=true;if(mode==='fan'){dragging=true;dragX=e.clientX;dragAcc=0;canvas.classList.add('drag')}});
window.addEventListener('pointerup',e=>{const was=dragging,mine=downOnCanvas;downOnCanvas=false;dragging=false;canvas.classList.remove('drag');if(!mine)return;if(was&&Math.abs(dragAcc)>6)return;pickClick()});
canvas.addEventListener('wheel',e=>{if(mode!=='fan')return;e.preventDefault();user();const g=groups().find(x=>x.key===openKey);fanOff=Math.max(0,Math.min(g.cards.length-1,fanOff+Math.sign(e.deltaY+e.deltaX)));layoutFan(openKey)},{passive:false});
function pickClick(){ray.setFromCamera(mouse,camera);
  if(mode==='table'){const h=ray.intersectObjects(hits,false)[0];if(h){fanOff=0;fanFilter='all';layoutFan(h.object.userData.key);return}const c=ray.intersectObjects([...cards.values()].filter(m=>m._in==='dense'||(m._in&&groups().find(g=>g.key===m._in&&g.spread))),false)[0];if(c)layoutDetail(c.object._p)}   // 牌桌上点空白:已经是最外层,不动
  else if(mode==='fan'){const c=ray.intersectObjects([...cards.values()].filter(m=>m._in===openKey),false)[0];if(c){const g=groups().find(x=>x.key===openKey);const idx=g.cards.indexOf(c.object._p);if(idx===fanOff)layoutDetail(c.object._p);else{fanOff=idx;layoutFan(openKey)}}else goBack()}
  else if(mode==='detail'){const s=ray.intersectObjects(snapHits,false)[0];if(s)focusStage(s.object._snap.userData.i);else goBack()}
  else if(mode==='stage'){const onSheet=ray.intersectObjects(stageProps,true)[0];if(!onSheet)goBack()}}
// 空白处 / 返回键 / Esc:都是回上一步
function goBack(){if(mode==='stage'){unfocusStage();return}if(mode==='detail'&&openKey){layoutTable();layoutFan(openKey)}else if(mode!=='table'){openKey=null;layoutTable()}renderFocus(null)}
document.getElementById('back').addEventListener('click',()=>{user();goBack()});
document.querySelectorAll('.bs-nav button').forEach(b=>b.addEventListener('click',()=>{user();document.querySelectorAll('.bs-nav button').forEach(x=>x.setAttribute('aria-pressed',x===b?'true':'false'));grouping=b.dataset.g;openKey=null;renderFocus(null);layoutTable()}));
window.addEventListener('keydown',e=>{if(e.key==='Escape'){user();document.getElementById('back').click()}if(mode==='fan'&&(e.key==='ArrowLeft'||e.key==='ArrowRight')){user();const g=groups().find(x=>x.key===openKey);fanOff=Math.max(0,Math.min(g.cards.length-1,fanOff+(e.key==='ArrowRight'?1:-1)));layoutFan(openKey)}});

// ───────── 轮播 ─────────
let tourOn=!reduced,tourT=0,tourStep=0,tourPaused=false;
// 轮播顺序(每轮约 50 秒):① 牌桌:有几件卡住 → ② 卡住的那堆翻三张:各卡在哪、等谁 → ③ 最久那件的时间轴 → ④ 它当前这一步的内容
// → ⑤ 按负责人:谁手里压着 → ⑥ 按步骤:流水线哪里堆 → ⑦ 明细:全盘扫一遍 → 回到 ①
const stuckSorted=()=>P.filter(p=>health(p)==='bad').sort((a,b)=>b.days-a.days);
const TOUR=[
  {ms:6000,run(){grouping='status';syncNav();openKey=null;fanFilter='all';layoutTable();renderFocus(null)}},
  {ms:3500,run(){const g=groups().find(x=>x.key==='bad')||groups()[0];fanOff=0;layoutFan(g.key)}},
  {ms:3000,run(){const g=groups().find(x=>x.key===openKey);if(g){fanOff=Math.min(1,g.cards.length-1);layoutFan(openKey)}}},
  {ms:3000,run(){const g=groups().find(x=>x.key===openKey);if(g){fanOff=Math.min(2,g.cards.length-1);layoutFan(openKey)}}},
  {ms:6000,run(){const st=stuckSorted()[0]||P[0];layoutDetail(st)}},
  {ms:7000,run(){if(current)focusStage(current.stage)}},
  {ms:5500,run(){grouping='owner';syncNav();openKey=null;layoutTable();renderFocus(null)}},
  {ms:5500,run(){grouping='stage';syncNav();openKey=null;layoutTable();renderFocus(null)}},
  {ms:8000,run(){grouping='dense';syncNav();openKey=null;layoutTable();renderFocus(null)}}]
function syncNav(){document.querySelectorAll('.bs-nav button').forEach(x=>x.setAttribute('aria-pressed',x.dataset.g===grouping?'true':'false'))}
function tourPause(v){tourPaused=v;document.getElementById('status').classList.toggle('paused',v||!tourOn);document.getElementById('tour').textContent=(!tourOn||v)?'继续轮播':'暂停轮播';document.getElementById('stline').textContent=v?'已暂停 · 45 秒无操作后继续':document.getElementById('stline').textContent}
document.getElementById('tour').addEventListener('click',()=>{if(!tourOn){tourOn=true;tourPaused=false;tourT=0;tourPause(false);TOUR[tourStep].run();return}lastUser=tourPaused?0:performance.now();tourPause(!tourPaused);if(!tourPaused){tourT=0;TOUR[tourStep].run()}});
function tourTick(dt,now){if(!tourOn)return;if(tourPaused){if(now-lastUser>45000){tourPaused=false;tourPause(false);tourT=0;TOUR[tourStep].run()}document.getElementById('bar').style.width='0';return}tourT+=dt;document.getElementById('bar').style.width=Math.min(100,tourT/TOUR[tourStep].ms*100)+'%';if(tourT>=TOUR[tourStep].ms){tourStep=(tourStep+1)%TOUR.length;tourT=0;TOUR[tourStep].run()}}

// ───────── 帧循环 ─────────
const v3=new THREE.Vector3();function project(pos,el){v3.copy(pos).project(camera);const r=canvas.getBoundingClientRect();el.style.left=((v3.x+1)/2*r.width)+'px';el.style.top=((1-v3.y)/2*r.height)+'px';el.style.opacity=(v3.z<1&&el.style.opacity!=='0.35')?'':el.style.opacity}
function resize(){const r=canvas.parentElement.getBoundingClientRect();renderer.setSize(r.width,r.height,false);camera.aspect=r.width/r.height;camera.updateProjectionMatrix()}window.addEventListener('resize',resize);
let last=performance.now();const tmpQ=new THREE.Quaternion();
function loop(now){const dt=Math.min(50,now-last);last=now;const k=reduced?1:1-Math.pow(0.001,dt/1000);
  camNow.pos.lerp(view.pos,k*0.9);camNow.tgt.lerp(view.tgt,k*0.9);camera.position.copy(camNow.pos);camera.lookAt(camNow.tgt);camLight.position.copy(camNow.pos).lerp(camNow.tgt,0.3);camLight.position.y+=4;
  cards.forEach(m=>{const p=m._p,h=health(p);const f=m._fl;if(f){const t=Math.min(1,Math.max(0,(now-f.t0)/f.dur));const e=ease(t);m._cur.copy(bezier(f,e));f.at.copy(m._cur);m.quaternion.copy(f.q0).slerp(f.q1,e);m.scale.setScalar(f.s0+(f.s1-f.s0)*e);if(t>=1){m._cur.copy(f.to);m._fl=null}}else{m._cur.lerp(m._goal.pos,k);m.quaternion.slerp(m._goal.quat,k);m.scale.setScalar(THREE.MathUtils.lerp(m.scale.x,m._goal.scale,k))}m._hov=THREE.MathUtils.lerp(m._hov,m._hovT,k*1.5);m.position.copy(m._cur);m.position.y+=m._hov;m._hovT=0;
    m._glow.material.opacity=h==='bad'?(reduced?0.6:0.45+Math.sin(now*0.0035+p.id)*0.3):(h==='warn'?(reduced?0.5:0.4+Math.sin(now*0.0022+p.id)*0.2):0.42);m._front.emissiveIntensity=1.15});
  // 悬停:桌面上摊开的牌 / 扇面 / 快照
  ray.setFromCamera(mouse,camera);let hov=null;if(mode==='detail'||mode==='stage'){hov=mode==='detail'?ray.intersectObjects(snapHits,false)[0]:null;const hs=hov?hov.object._snap:null;snaps.forEach(s=>{const on=hs===s;s._cur.lerp(s._goal,k);s._hov=THREE.MathUtils.lerp(s._hov,on?0.35:0,k*1.5);s.position.copy(s._cur);s.position.y+=s._hov;s.rotation.y=THREE.MathUtils.lerp(s.rotation.y,s._goalRot,k);const sc=THREE.MathUtils.lerp(s.scale.x,s._goalScale,k);s.scale.setScalar(sc);s.material.opacity=THREE.MathUtils.lerp(s.material.opacity,s._goalOp,k);s.material.emissiveIntensity=on?0.95:(s.userData.i===current.stage?0.7:(s.userData.i<current.stage?0.5:0.25));const h=snapHits[s.userData.i];if(h){h.position.copy(s._cur);h.rotation.copy(s.rotation);h.scale.copy(s.scale)}});stageProps.forEach(o=>{o.position.lerp(o._goal,k);o.scale.lerp(o._gs,k);if(o._grot!==undefined)o.rotation.y=THREE.MathUtils.lerp(o.rotation.y,o._grot,k);
    if(o._pic){o._lit=THREE.MathUtils.lerp(o._lit,o._litT,k*0.55);const L=o._lit;o._pic.material.emissiveIntensity=L*0.95;o._pic.material.color.setScalar(0.06+0.94*L);o._strip.material.emissiveIntensity=L*2.4;o._wash.material.opacity=L;o._plate.material.emissiveIntensity=L*0.25;o.rotation.y=THREE.MathUtils.lerp(o.rotation.y,-mouse.x*0.2,k)}if(o._mat&&o._gop!==undefined)o._mat.opacity=THREE.MathUtils.lerp(o._mat.opacity,o._gop,k)})}
  else{const list=mode==='table'?[...hits,...[...cards.values()].filter(m=>m._in==='dense'||(m._in&&groups().find(g=>g.key===m._in&&g.spread)))]:[...cards.values()].filter(m=>m._in===openKey);hov=ray.intersectObjects(list,false)[0];if(hov&&hov.object.userData.kind==='card')hov.object._hovT=0.22;pads.forEach(pd=>{if(pd.material.emissiveIntensity!==undefined)pd.material.emissiveIntensity=(hov&&hov.object.userData.kind==='pile'&&Math.abs(pd.position.x-hov.object.position.x)<0.01)?0.35:0.08})}
  canvas.style.cursor=hov?'pointer':(mode==='fan'?'grab':'');
  labels.forEach(l=>{l.material.opacity=THREE.MathUtils.lerp(l.material.opacity,l._op,k)});
  tourTick(dt,now);renderer.render(scene,camera);requestAnimationFrame(loop)}
resize();renderTot();layoutTable();renderFocus(null);document.getElementById('status').classList.toggle('paused',!tourOn);if(!tourOn)document.getElementById('tour').textContent='继续轮播';requestAnimationFrame(loop);
})();
</script>
</body>
</html>
