<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050b18">
<link rel="icon" href="../assets/favicon.ico" sizes="any">
<title>动线玻璃实验台</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{--bg:#050b18;--ink:#e3f1ff;--dim:#5f7f9e;--dim2:#8fa9c4;--rule:rgba(120,190,255,.15);--acc:#a6dcff;--live:#e8cf8f;--bad:#c76b6b;--warn:#d9a441;--ok:#5fd3c4;
  --sans:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;--mono:"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;color-scheme:dark}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;overflow:hidden;text-transform:uppercase;letter-spacing:.12em}
.bs{position:relative;width:100%;height:100%;min-height:640px}
.bs-gl{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab}.bs-gl.drag{cursor:grabbing}
.bs-vig{position:absolute;inset:0;pointer-events:none;z-index:2;background:radial-gradient(ellipse 70% 60% at 50% 55%,transparent 55%,rgba(0,0,0,.5) 100%)}
.bs-frame{position:absolute;inset:12px;pointer-events:none;z-index:3;border:1px solid var(--rule);clip-path:polygon(0 0,calc(100% - 22px) 0,100% 22px,100% 100%,22px 100%,0 calc(100% - 22px))}
.bs-hud{position:absolute;z-index:4;font-size:10px;color:var(--dim)}
.bs-brand{top:32px;left:40px;display:flex;flex-direction:column;gap:7px}.bs-brand .t{color:var(--ink);font-weight:500;letter-spacing:.4em;font-size:12px}
.bs-brand .s{font-family:var(--mono);letter-spacing:.2em}
.bs-nav{top:34px;left:50%;transform:translateX(-50%);display:flex;align-items:center;border:1px solid var(--rule);background:color-mix(in srgb,var(--bg) 55%,transparent)}
.bs-nav button{appearance:none;background:none;border:0;color:var(--dim);font:inherit;letter-spacing:.18em;text-transform:uppercase;padding:9px 16px;cursor:pointer;min-height:36px;border-right:1px solid var(--rule)}
.bs-nav button:last-child{border-right:0}.bs-nav button[aria-pressed="true"]{color:var(--live)}
.bs-lights{right:40px;top:34px;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.bs-lights label{display:flex;align-items:center;gap:10px;cursor:pointer;color:var(--dim);font-family:var(--mono);letter-spacing:.16em}
.bs-lights label i{width:8px;height:8px;display:block;border:1px solid var(--dim)}
.bs-lights input{display:none}.bs-lights input:checked+i{background:var(--live);border-color:var(--live)}
.bs-lights input:checked~span{color:var(--ink)}
.bs-hint{bottom:34px;left:50%;transform:translateX(-50%);white-space:nowrap;font-family:var(--mono);letter-spacing:.2em}
.lbls{position:absolute;inset:0;pointer-events:none;z-index:3}
.lbls div{position:absolute;transform:translate(-50%,0);white-space:nowrap;text-align:center;font-family:var(--mono);font-size:10px;letter-spacing:.18em;color:var(--dim)}
.lbls div b{display:block;font-family:var(--sans);font-weight:400;letter-spacing:.14em;color:var(--ink);font-size:12.5px;text-transform:none;margin-bottom:4px}
@media (max-width:640px){.bs-lights{display:none}.bs-nav{top:auto;bottom:60px}}
</style>
</head>
<body>
<div class="bs">
  <canvas class="bs-gl" id="gl"></canvas>
  <div class="lbls" id="lbls"></div>
  <div class="bs-vig"></div><div class="bs-frame"></div>
  <div class="bs-hud bs-brand"><span class="t">动线玻璃实验台</span><span class="s">GLASS · MATERIAL LAB · 示例场景</span></div>
  <div class="bs-hud bs-nav" id="presets">
    <button data-p="studio" aria-pressed="true">工作室</button><button data-p="gallery">画廊</button><button data-p="neon">霓虹</button><button data-p="dawn">晨光</button>
  </div>
  <div class="bs-hud bs-lights" id="lights"></div>
  <div class="bs-hud bs-hint" id="hint">拖动环视 · 滚轮远近 · 右上角开关每一盏灯</div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.158.0/three.min.js"></script>
<script>
(function(){
'use strict';
const canvas=document.getElementById('gl');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:false});
renderer.setPixelRatio(Math.min(2,window.devicePixelRatio||1));
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;
renderer.outputColorSpace=THREE.SRGBColorSpace;
const scene=new THREE.Scene();
(function(){const cv=document.createElement('canvas');cv.width=4;cv.height=256;const c=cv.getContext('2d');const g=c.createLinearGradient(0,0,0,256);g.addColorStop(0,'#050b18');g.addColorStop(0.55,'#0c1f3a');g.addColorStop(0.62,'#0a1a30');g.addColorStop(1,'#050b18');c.fillStyle=g;c.fillRect(0,0,4,256);const t=new THREE.CanvasTexture(cv);t.colorSpace=THREE.SRGBColorSpace;scene.background=t})();scene.fog=new THREE.FogExp2(0x050b18,0.018);
const camera=new THREE.PerspectiveCamera(36,1,0.1,300);

// ───────── 环境:玻璃要「照见」点什么才像玻璃。没有外部 HDR,就用几块发光板拼一间暗房,烤成环境贴图 ─────────
function bakeEnvironment(){const env=new THREE.Scene();
  const room=new THREE.Mesh(new THREE.BoxGeometry(60,30,60),new THREE.MeshBasicMaterial({color:new THREE.Color(0.05,0.11,0.2),side:THREE.BackSide}));env.add(room);
  const panel=(w,h,color,x,y,z,rx,ry)=>{const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({color:new THREE.Color(...color),side:THREE.DoubleSide}));m.position.set(x,y,z);m.rotation.set(rx||0,ry||0,0);env.add(m)};
  panel(34,10,[4.0,3.7,3.1],0,14.5,0,Math.PI/2,0);            // 顶上一整条暖白柔光
  panel(5,26,[1.6,3.0,4.2],-29,4,0,0,Math.PI/2);            // 左边一竖条冷光
  panel(5,26,[3.6,3.0,1.6],29,4,0,0,-Math.PI/2);            // 右边一竖条金光
  panel(24,3,[0.8,2.8,3.6],0,3,-29,0,0);panel(24,3,[0.8,2.8,3.6],0,3,29,0,0);                     // 后墙一道青色霓虹
  const pm=new THREE.PMREMGenerator(renderer);pm.compileEquirectangularShader();const t=pm.fromScene(env,0.06).texture;pm.dispose();return t}
scene.environment=bakeEnvironment();

// ───────── 地面与网格(动线牌桌同款) ─────────
const ground=new THREE.Mesh(new THREE.PlaneGeometry(300,300),new THREE.MeshStandardMaterial({color:0x06101f,roughness:0.32,metalness:0.6}));ground.rotation.x=-Math.PI/2;scene.add(ground);
const grid=new THREE.GridHelper(160,64,0x173654,0x0e223a);grid.position.y=0.005;grid.material.opacity=0.55;grid.material.transparent=true;scene.add(grid);

// ───────── 灯:六盏,各不一样,右上角可以单独开关 ─────────
const L={};
L.hemi=new THREE.HemisphereLight(0x9fb3c8,0x050b18,0.5);
L.key=new THREE.DirectionalLight(0xffffff,2.2);L.key.position.set(-14,26,18);
L.rim=new THREE.DirectionalLight(0x9fd8ff,1.4);L.rim.position.set(18,10,-24);
L.warm=new THREE.PointLight(0xffc36b,180,60,1.6);L.warm.position.set(6,5,6);
L.cool=new THREE.PointLight(0x5fb8ff,120,60,1.6);L.cool.position.set(-8,3,-4);
L.spot=new THREE.SpotLight(0xfff1d6,900,70,0.36,0.55,1.6);L.spot.position.set(0,22,4);L.spot.target.position.set(0,0,0);scene.add(L.spot.target);
(function(){const cv=document.createElement('canvas');cv.width=512;cv.height=160;const c=cv.getContext('2d');const g=c.createLinearGradient(0,0,512,0);g.addColorStop(0,'#2f5f96');g.addColorStop(0.5,'#f2e6cf');g.addColorStop(1,'#c9a35a');c.fillStyle=g;c.fillRect(0,0,512,160);
  // 四边羽化:椭圆径向遮罩
  c.globalCompositeOperation='destination-in';const r=c.createRadialGradient(256,80,10,256,80,250);r.addColorStop(0,'rgba(0,0,0,1)');r.addColorStop(0.55,'rgba(0,0,0,0.6)');r.addColorStop(1,'rgba(0,0,0,0)');c.fillStyle=r;c.save();c.scale(1,160/512*1.6);c.fillRect(0,0,512,512);c.restore();
  const t=new THREE.CanvasTexture(cv);t.colorSpace=THREE.SRGBColorSpace;const wall=new THREE.Mesh(new THREE.PlaneGeometry(56,17.5),new THREE.MeshBasicMaterial({map:t,transparent:true,opacity:0.7,fog:false,depthWrite:false}));wall.position.set(0,5.5,-34);L.wall=wall})();
Object.values(L).forEach(l=>scene.add(l));
// 灯的可见「灯头」:点光源画成小发光球,看得出光从哪来
const bulb=(light,color)=>{const b=new THREE.Mesh(new THREE.SphereGeometry(0.16,16,16),new THREE.MeshBasicMaterial({color}));light.add(b);return b};
bulb(L.warm,0xffd28a);bulb(L.cool,0x9fd8ff);
const LIGHT_UI=[['wall','背景柔光墙'],['key','主光 · 冷白平行光'],['spot','顶部射灯 · 暖白'],['warm','暖点光 · 绕圈'],['cool','冷点光 · 反向绕圈'],['rim','轮廓光 · 青'],['hemi','环境半球光']];
const lightsBox=document.getElementById('lights');
LIGHT_UI.forEach(([k,l])=>{const lab=document.createElement('label');lab.innerHTML=`<input type="checkbox" data-l="${k}" checked><i></i><span>${l}</span>`;lightsBox.appendChild(lab);lab.querySelector('input').addEventListener('change',e=>{L[k].visible=e.target.checked})});

// ───────── 四件玻璃 ─────────
// 玻璃的要点:transmission(透)+ thickness(厚,折射走多远)+ ior(折射率)+ roughness(磨砂程度)+ attenuation(有色玻璃里光走得越远越染色)
function glass(o){return new THREE.MeshPhysicalMaterial(Object.assign({
  transmission:1,thickness:1.2,ior:1.5,roughness:0.05,metalness:0,
  clearcoat:1,clearcoatRoughness:0.05,envMapIntensity:1.5,
  attenuationColor:new THREE.Color(0xffffff),attenuationDistance:8,
  specularIntensity:1,side:THREE.FrontSide},o))}
const items=[];
function place(mesh,x,label,sub){mesh.position.x=x;scene.add(mesh);items.push({mesh,label,sub,base:mesh.position.clone()});return mesh}

// 1 立方体:纯净透明玻璃,带一点色散感的青边
const cube=new THREE.Mesh(new THREE.BoxGeometry(2.6,2.6,2.6),glass({thickness:2.6,attenuationColor:new THREE.Color(0xd9f3ff),attenuationDistance:6}));
cube.position.y=1.3+0.9;place(cube,-8.4,'立方体','CLEAR · IOR 1.5 · 厚 2.6');

// 2 长方体:有色玻璃(琥珀),厚度大,光走得远就染得深
const slab=new THREE.Mesh(new THREE.BoxGeometry(4.2,2.0,1.6),glass({thickness:2.0,attenuationColor:new THREE.Color(0xe8a84a),attenuationDistance:2.2,roughness:0.08}));
slab.position.y=1.0+0.9;place(slab,-2.9,'长方体','AMBER · 衰减 2.2 · 厚 2.0');

// 3 3D 字母:F 与 B(动线 = Fortbrain),挤出成型带倒角,磨砂玻璃
function letterF(){const s=new THREE.Shape();s.moveTo(0,0);s.lineTo(0,3);s.lineTo(2.1,3);s.lineTo(2.1,2.45);s.lineTo(0.7,2.45);s.lineTo(0.7,1.75);s.lineTo(1.8,1.75);s.lineTo(1.8,1.22);s.lineTo(0.7,1.22);s.lineTo(0.7,0);s.closePath();return s}
function letterB(){const s=new THREE.Shape();s.moveTo(0,0);s.lineTo(0,3);s.lineTo(1.45,3);s.bezierCurveTo(2.25,3,2.45,2.55,2.45,2.2);s.bezierCurveTo(2.45,1.85,2.25,1.62,1.95,1.55);s.bezierCurveTo(2.35,1.45,2.6,1.15,2.6,0.8);s.bezierCurveTo(2.6,0.3,2.3,0,1.55,0);s.closePath();
  const h1=new THREE.Path();h1.moveTo(0.7,1.8);h1.lineTo(0.7,2.45);h1.lineTo(1.4,2.45);h1.bezierCurveTo(1.7,2.45,1.8,2.3,1.8,2.12);h1.bezierCurveTo(1.8,1.95,1.7,1.8,1.4,1.8);h1.closePath();s.holes.push(h1);
  const h2=new THREE.Path();h2.moveTo(0.7,0.55);h2.lineTo(0.7,1.28);h2.lineTo(1.5,1.28);h2.bezierCurveTo(1.85,1.28,1.95,1.1,1.95,0.92);h2.bezierCurveTo(1.95,0.72,1.85,0.55,1.5,0.55);h2.closePath();s.holes.push(h2);return s}
const extrude={depth:0.8,bevelEnabled:true,bevelThickness:0.08,bevelSize:0.08,bevelSegments:4,curveSegments:24};
const frost=glass({thickness:0.8,roughness:0.32,attenuationColor:new THREE.Color(0xbfe9ff),attenuationDistance:3,clearcoatRoughness:0.25});
const letters=new THREE.Group();
const gF=new THREE.ExtrudeGeometry(letterF(),extrude);gF.center();const mF=new THREE.Mesh(gF,frost);mF.position.x=-1.5;letters.add(mF);
const gB=new THREE.ExtrudeGeometry(letterB(),extrude);gB.center();const mB=new THREE.Mesh(gB,frost);mB.position.x=1.5;letters.add(mB);
letters.position.y=1.5+0.9;place(letters,2.9,'3D 字母','FROSTED · 粗糙 0.32 · 挤出带倒角');

// 4 一片有厚度的薄玻璃:8 毫米,微微偏青,边缘能看到厚度;带一点点彩虹膜(iridescence)
const pane=new THREE.Mesh(new THREE.BoxGeometry(4.6,3.2,0.08),glass({thickness:0.08,attenuationColor:new THREE.Color(0xcdeee6),attenuationDistance:0.6,ior:1.52,iridescence:0.35,iridescenceIOR:1.3,iridescenceThicknessRange:[100,400]}));
pane.position.y=1.6+0.9;pane.rotation.y=-0.35;place(pane,8.6,'薄玻璃','8 mm · 有厚度 · 带一点彩虹膜');

// 每件底下一个底座圆环,和牌桌的牌堆底座一个语言
items.forEach(it=>{const ring=new THREE.Mesh(new THREE.TorusGeometry(2.4,0.025,6,64),new THREE.MeshBasicMaterial({color:0x3fa9cc,transparent:true,opacity:0.45}));ring.rotation.x=Math.PI/2;ring.position.set(it.base.x,0.03,0);scene.add(ring);
  const pad=new THREE.Mesh(new THREE.CylinderGeometry(2.25,2.35,0.22,48),new THREE.MeshStandardMaterial({color:0x0a2038,roughness:0.35,metalness:0.6}));pad.position.set(it.base.x,0.11,0);scene.add(pad)});

// ───────── 标签(HTML,跟着物体投影) ─────────
const lbls=document.getElementById('lbls');
const labelEls=items.map(it=>{const d=document.createElement('div');d.innerHTML=`<b>${it.label}</b>${it.sub}`;lbls.appendChild(d);return d});
const v3=new THREE.Vector3();
function projectLabels(){const r=canvas.getBoundingClientRect();items.forEach((it,i)=>{v3.set(it.base.x,-0.15,2.6).project(camera);const el=labelEls[i];el.style.left=((v3.x+1)/2*r.width)+'px';el.style.top=((1-v3.y)/2*r.height)+'px';el.style.opacity=v3.z<1?'':'0'})}

// ───────── 灯光预设:同一组灯,四种组合,看玻璃在不同光下的样子 ─────────
const PRESETS={
  studio:{key:[0xffffff,2.2],rim:[0x9fd8ff,1.4],warm:[0xffc36b,180],cool:[0x5fb8ff,120],spot:[0xfff1d6,900],hemi:0.5,exposure:1.05,hint:'工作室:冷白主光 + 顶部射灯,玻璃的折射与倒角最清楚'},
  gallery:{key:[0xffffff,0.6],rim:[0x9fd8ff,0.5],warm:[0xffd9a0,60],cool:[0x5fb8ff,30],spot:[0xffe4b0,1400],hemi:0.25,exposure:0.95,hint:'画廊:只留头顶一束暖射灯,看光在玻璃里的走向'},
  neon:{key:[0xffffff,0.35],rim:[0x3fa9cc,2.4],warm:[0xff4d8d,220],cool:[0x2fd0ff,220],spot:[0xfff1d6,120],hemi:0.2,exposure:1.1,hint:'霓虹:两盏彩色点光反向绕圈,看有色玻璃怎么混色'},
  dawn:{key:[0xffd6a8,3.0],rim:[0xa6dcff,0.9],warm:[0xffb26b,90],cool:[0x7fc8ff,40],spot:[0xfff1d6,300],hemi:0.7,exposure:1.0,hint:'晨光:低角度暖平行光,长影子与长高光'}};
function applyPreset(name){const p=PRESETS[name];L.key.color.set(p.key[0]);L.key.intensity=p.key[1];L.rim.color.set(p.rim[0]);L.rim.intensity=p.rim[1];L.warm.color.set(p.warm[0]);L.warm.intensity=p.warm[1];L.cool.color.set(p.cool[0]);L.cool.intensity=p.cool[1];L.spot.color.set(p.spot[0]);L.spot.intensity=p.spot[1];L.hemi.intensity=p.hemi;renderer.toneMappingExposure=p.exposure;
  L.key.position.set(name==='dawn'?-30:-14,name==='dawn'?6:26,18);
  L.warm.children[0].material.color.set(p.warm[0]);L.cool.children[0].material.color.set(p.cool[0]);
  document.getElementById('hint').textContent=p.hint+' · 拖动环视 · 滚轮远近';
  document.querySelectorAll('#presets button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.p===name?'true':'false'))}
document.querySelectorAll('#presets button').forEach(b=>b.addEventListener('click',()=>applyPreset(b.dataset.p)));
applyPreset('studio');

// ───────── 镜头:简单的拖动环视 + 滚轮远近(不引外部控件) ─────────
const orbit={theta:0.0,phi:1.18,r:24,tx:0,ty:1.8};let dragging=false,lx=0,ly=0;
canvas.addEventListener('pointerdown',e=>{dragging=true;lx=e.clientX;ly=e.clientY;canvas.classList.add('drag')});
window.addEventListener('pointerup',()=>{dragging=false;canvas.classList.remove('drag')});
window.addEventListener('pointermove',e=>{if(!dragging)return;orbit.theta-=(e.clientX-lx)*0.005;orbit.phi=Math.max(0.35,Math.min(1.45,orbit.phi-(e.clientY-ly)*0.004));lx=e.clientX;ly=e.clientY});
canvas.addEventListener('wheel',e=>{e.preventDefault();orbit.r=Math.max(12,Math.min(50,orbit.r+Math.sign(e.deltaY)*1.5))},{passive:false});
function resize(){const r=canvas.parentElement.getBoundingClientRect();renderer.setSize(r.width,r.height,false);camera.aspect=r.width/r.height;camera.updateProjectionMatrix()}
window.addEventListener('resize',resize);resize();

// ───────── 循环:物体慢转、两盏点光绕圈、射灯轻摆 ─────────
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
let t0=performance.now();
function loop(now){const t=(now-t0)/1000;
  const auto=reduced?0:Math.sin(t*0.12)*0.22;
  camera.position.set(orbit.tx+orbit.r*Math.sin(orbit.phi)*Math.sin(orbit.theta+auto),orbit.ty+orbit.r*Math.cos(orbit.phi),orbit.r*Math.sin(orbit.phi)*Math.cos(orbit.theta+auto));
  camera.lookAt(orbit.tx,orbit.ty,0);
  if(!reduced){cube.rotation.y=t*0.35;cube.rotation.x=Math.sin(t*0.3)*0.25;slab.rotation.y=-t*0.25;letters.rotation.y=Math.sin(t*0.5)*0.55;pane.rotation.y=-0.35+Math.sin(t*0.4)*0.3;
    L.warm.position.set(Math.cos(t*0.6)*9,4.5+Math.sin(t*0.9)*1.5,Math.sin(t*0.6)*9);
    L.cool.position.set(Math.cos(-t*0.45+2)*11,3+Math.cos(t*0.7)*1.2,Math.sin(-t*0.45+2)*11);
    L.spot.target.position.set(Math.sin(t*0.3)*4,0,Math.cos(t*0.3)*2);L.spot.target.updateMatrixWorld()}
  projectLabels();renderer.render(scene,camera);requestAnimationFrame(loop)}
requestAnimationFrame(loop);
})();
</script>
<script src="preview.js"></script>
</body>
</html>
