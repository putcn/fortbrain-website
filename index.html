<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Fortbrain — 让 AI 成为企业不知疲倦的成长动力。降人力成本，增加单位人效。">
<meta name="theme-color" content="#050b18">
<title>Fortbrain</title>
<link rel="icon" href="assets/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="apple-touch-icon" sizes="256x256" href="assets/icon-256.png">
<link rel="stylesheet" href="css/site.css">
<link rel="stylesheet" href="css/demo.css">
<script type="importmap">
{ "imports": {
  "three": "./vendor/three/three.module.min.js",
  "three/addons/": "./vendor/three/addons/"
} }
</script>
</head>
<body>

<canvas id="gl" aria-hidden="true"></canvas>
<canvas id="aurora2d" aria-hidden="true" hidden></canvas>

<!-- Stage 2: the Fortbrain workbench, exploded into three layers (rebuilt in HTML, demo data only) -->
<div id="layers" aria-hidden="true">
  <div class="stage">
    <div class="layer nav">
      <div class="brandrow"><span class="logo">F</span><span data-i18n="ui.brand"></span></div>
      <ul>
        <li data-i18n="ui.nav" data-i18n-index="0"></li>
        <li class="cur" data-i18n="ui.nav" data-i18n-index="1"></li>
        <li data-i18n="ui.nav" data-i18n-index="2"></li>
        <li data-i18n="ui.nav" data-i18n-index="3"></li>
        <li data-i18n="ui.nav" data-i18n-index="4"></li>
        <li data-i18n="ui.nav" data-i18n-index="5"></li>
        <li data-i18n="ui.nav" data-i18n-index="6"></li>
        <li data-i18n="ui.nav" data-i18n-index="7"></li>
        <li data-i18n="ui.nav" data-i18n-index="8"></li>
        <li class="grp" data-i18n="ui.nav" data-i18n-index="9"></li>
        <li data-i18n="ui.nav" data-i18n-index="10"></li>
        <li data-i18n="ui.nav" data-i18n-index="11"></li>
      </ul>
    </div>
    <div class="layer list">
      <div class="tabs"><span class="cur" data-i18n="ui.tabs" data-i18n-index="0"></span><span data-i18n="ui.tabs" data-i18n-index="1"></span></div>
      <div class="search" data-i18n="ui.search"></div>
      <div class="rows">
        <div class="row cur"><b data-i18n="ui.list.0.0"></b><span data-i18n="ui.list.0.1"></span></div>
        <div class="row"><b data-i18n="ui.list.1.0"></b><span data-i18n="ui.list.1.1"></span></div>
        <div class="row"><b data-i18n="ui.list.2.0"></b><span data-i18n="ui.list.2.1"></span></div>
        <div class="row"><b data-i18n="ui.list.3.0"></b><span data-i18n="ui.list.3.1"></span></div>
        <div class="row"><b data-i18n="ui.list.4.0"></b><span data-i18n="ui.list.4.1"></span></div>
        <div class="row"><b data-i18n="ui.list.5.0"></b><span data-i18n="ui.list.5.1"></span></div>
      </div>
    </div>
    <div class="layer main">
      <div class="head"><span class="dot"></span><span data-i18n="ui.chat.title"></span></div>
      <div class="msg bot">
        <div class="card">
          <b data-i18n="ui.chat.card.0"></b>
          <p data-i18n="ui.chat.card.1"></p>
          <p class="sug" data-i18n="ui.chat.card.2"></p>
        </div>
      </div>
      <div class="msg me"><span data-i18n="ui.chat.user"></span></div>
      <div class="msg bot"><p data-i18n="ui.chat.reply"></p></div>
    </div>
  </div>
</div>

<button id="langBtn" type="button" aria-label="Switch language" data-i18n="lang"></button>
<div class="brand" aria-hidden="true">Fortbrain</div>

<main>
  <section data-stage="0" class="s-hero">
    <div class="copy">
      <h1 data-i18n="q"></h1>
      <div class="hint" data-i18n="hint"></div>
    </div>
  </section>

  <section data-stage="1">
    <div class="copy">
      <div class="label" data-i18n="thesis.label"></div>
      <h2 data-i18n="thesis.title"></h2>
      <p data-i18n="thesis.body"></p>
    </div>
  </section>

  <section data-stage="2" class="s-layers">
    <div class="copy">
      <div class="label" data-i18n="layers.label"></div>
      <h2 data-i18n="layers.title"></h2>
      <p data-i18n="layers.body"></p>
    </div>
  </section>

  <section data-stage="3" class="s-chapter">
    <div class="copy">
      <div class="label" data-i18n="c1.label"></div>
      <h2 data-i18n="c1.title"></h2>
      <p data-i18n="c1.body"></p>
      <button class="demo-btn" type="button" data-demo="data" data-i18n="demoBtn"></button>
    </div>
  </section>
  <section data-stage="4" class="s-chapter">
    <div class="copy">
      <div class="label" data-i18n="c2.label"></div>
      <h2 data-i18n="c2.title"></h2>
      <p data-i18n="c2.body"></p>
      <button class="demo-btn" type="button" data-demo="forecast" data-i18n="demoBtn"></button>
    </div>
  </section>
  <section data-stage="5" class="s-chapter">
    <div class="copy">
      <div class="label" data-i18n="c3.label"></div>
      <h2 data-i18n="c3.title"></h2>
      <p data-i18n="c3.body"></p>
      <button class="demo-btn" type="button" data-demo="decide" data-i18n="demoBtn"></button>
    </div>
  </section>
  <section data-stage="6" class="s-chapter">
    <div class="copy">
      <div class="label" data-i18n="c4.label"></div>
      <h2 data-i18n="c4.title"></h2>
      <p data-i18n="c4.body"></p>
      <button class="demo-btn" type="button" data-demo="agents" data-i18n="demoBtn"></button>
    </div>
  </section>
  <section data-stage="7" class="s-chapter">
    <div class="copy">
      <div class="label" data-i18n="c5.label"></div>
      <h2 data-i18n="c5.title"></h2>
      <p data-i18n="c5.body"></p>
      <button class="demo-btn" type="button" data-demo="hybrid" data-i18n="demoBtn"></button>
    </div>
  </section>
  <section data-stage="8" class="s-chapter">
    <div class="copy">
      <div class="label" data-i18n="c6.label"></div>
      <h2 data-i18n="c6.title"></h2>
      <p data-i18n="c6.body"></p>
      <button class="demo-btn" type="button" data-demo="trust" data-i18n="demoBtn"></button>
    </div>
  </section>

  <section data-stage="9" class="s-end">
    <div class="copy">
      <p class="result" data-i18n="result"></p>
      <h2 class="answer" data-i18n="answer"></h2>
      <p class="answer-sub" data-i18n="answerSub"></p>
      <p class="contact"><span data-i18n="contactPre"></span> <a id="mail" href="#"></a></p>
    </div>
  </section>
</main>

<div id="demo" hidden role="dialog" aria-modal="true">
  <div class="fbd-panel">
    <div class="fbd-top"><b class="fbd-title"></b><span class="fbd-step"></span><button class="fbd-x" type="button" aria-label="Close">×</button></div>
    <div class="fbd-stage"></div>
    <div class="fbd-bottom">
      <button class="fbd-btn fbd-prev" type="button"></button>
      <button class="fbd-btn fbd-play" type="button"></button>
      <button class="fbd-btn pri fbd-next" type="button"></button>
    </div>
  </div>
</div>

<script type="module" src="js/main.js?v=2026-09-21d"></script>
</body>
</html>
